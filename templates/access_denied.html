<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Restricted | Seattle Civilian Portal</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/Tab_Logo_ID.png') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(180deg, #0b1724 0%, #101d2a 100%);
            color: #e2e8f0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-6">
    <main class="w-full max-w-lg bg-slate-900 border border-slate-700 rounded-md p-8 text-center shadow-2xl">
        <img src="{{ url_for('static', filename='images/Tab_Logo_ID.png') }}" alt="Seattle Civilian Portal" class="w-16 h-16 object-contain mx-auto mb-6">
        <p class="text-xs uppercase tracking-widest text-sky-400 font-semibold">Seattle Civilian Services</p>
        <h1 class="mt-2 text-2xl font-bold text-white">Access restricted</h1>
        <p class="mt-3 text-sm leading-6 text-slate-300">Dashboard access requires your Roblox account to be verified on the Civilian team in the current ER:LC server.</p>
        <p class="mt-2 text-xs text-slate-500">If you have just joined the Civilian team, refresh this page to recheck your access.</p>
        <a href="{{ url_for('logout') }}" class="mt-7 inline-flex items-center justify-center rounded-md bg-slate-800 px-4 py-2.5 text-sm font-medium text-white hover:bg-slate-700">
            Sign out
        </a>
    </main>
</body>
</html>
