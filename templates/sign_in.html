<!DOCTYPE html>
<html lang="en" class="dark h-full bg-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Seattle, Washington Civilian Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-6">
    <main class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900/90 p-8 text-center shadow-2xl">
        <img src="{{ url_for('static', filename='images/Tab_Logo_ID.png') }}" alt="Seattle Civilian Portal logo" width="96" height="76" class="mx-auto mb-6 h-20 w-24 object-contain">
        <p class="text-xs font-semibold uppercase tracking-[0.25em] text-sky-400">Seattle, Washington</p>
        <h1 class="mt-2 text-2xl font-bold">Civilian Portal</h1>
        <p class="mt-3 text-sm leading-6 text-slate-400">Sign in with Roblox to access your civilian records, registered vehicles, and private assistance requests.</p>
        <a href="{{ url_for('roblox_login') }}" class="mt-8 flex items-center justify-center gap-2 rounded-xl bg-sky-600 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-sky-950/40 transition hover:bg-sky-500">
            <span>Continue with Roblox</span>
        </a>
        <p class="mt-5 text-xs text-slate-500">You must be signed in to use the civilian portal.</p>
    </main>
</body>
</html>
